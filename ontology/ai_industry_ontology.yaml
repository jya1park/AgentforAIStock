# AI 산업 온톨로지
# 계층: domain -> layer -> segment -> companies
# 각 종목은 yfinance 심볼. 한국주식은 .KS(KOSPI), .KQ(KOSDAQ) suffix.
# 한 회사가 여러 segment에 속할 수 있음 (cross-tagging 허용).

version: 1
last_updated: "2026-05-17"

